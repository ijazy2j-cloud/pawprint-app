upstream app_server { server app:3000; }

limit_req_zone $binary_remote_addr zone=pawprint_api:10m rate=10r/s;

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
  listen 80;
  server_name _;
  client_max_body_size 10M;

  # For Let's Encrypt later:
  # location /.well-known/acme-challenge/ { root /var/www/certbot; }
  # return 301 https://$host$request_uri;

  location /_next/static/ {
    proxy_pass http://app_server;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico)$ {
    proxy_pass http://app_server;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    limit_req zone=pawprint_api burst=20 nodelay;
    proxy_pass http://app_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://app_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
